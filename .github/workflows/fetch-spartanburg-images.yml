name: fetch-spartanburg-images
on:
  push:
    branches: [claude/spartanburg-image-fix]
    paths: ['.github/workflows/fetch-spartanburg-images.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated images and convert to jpg
        run: |
          set -euo pipefail
          base="https://d8j0ntlcm91z4.cloudfront.net/user_357oxtq8Omkf5Fq3vjrGhYzKpXM"
          curl -fSL -o /tmp/action.png  "$base/hf_20260709_023735_57138ac2-feed-4ea1-9d3c-67ab70e06440.png"
          curl -fSL -o /tmp/about.png   "$base/hf_20260709_023750_53c1f552-91cf-45d2-baf1-d350ffd99b00.png"
          curl -fSL -o /tmp/ctabg.png   "$base/hf_20260709_023800_6d17dd41-16a8-40d2-9167-f8d1eb2e286e.png"
          curl -fSL -o /tmp/areasbg.png "$base/hf_20260709_023811_22e51fbd-81ff-484a-baf4-d2dd43626ef8.png"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          for src, dst in [
              ('/tmp/action.png',  'assets/action-spartanburg.jpg'),
              ('/tmp/about.png',   'assets/about-spartanburg.jpg'),
              ('/tmp/ctabg.png',   'assets/cta-bg-spartanburg.jpg'),
              ('/tmp/areasbg.png', 'assets/areas-bg-spartanburg.jpg'),
          ]:
              Image.open(src).convert('RGB').save(dst, 'JPEG', quality=92)
              print('wrote', dst)
          PY
          ls -la assets/*spartanburg*
      - name: Commit images to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/action-spartanburg.jpg assets/about-spartanburg.jpg assets/cta-bg-spartanburg.jpg assets/areas-bg-spartanburg.jpg
          git commit -m "Add regenerated Spartanburg images (SC-appropriate)"
          git push
